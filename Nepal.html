<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nepal Intro Screen</title>

  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Oswald", sans-serif;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      background:
        linear-gradient(rgba(255,255,255,0.12), rgba(255,255,255,0.12)),
        url("https://images.unsplash.com/photo-1544735716-392fe2489ffa?q=80&w=1974&auto=format&fit=crop");
      background-size: cover;
      background-position: center;
    }

    .sky-animation {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 5;
    }

    .paper-plane {
      position: absolute;
      top: 120px;
      left: -140px;
      width: 90px;
      height: 60px;
      animation: flyAcross 8s linear infinite;
    }

    .plane-body {
      position: absolute;
      width: 90px;
      height: 45px;
      background: white;
      clip-path: polygon(0 45%, 100% 0, 72% 52%, 100% 100%);
      filter: drop-shadow(0 8px 8px rgba(0,0,0,0.25));
    }

    .plane-wing {
      position: absolute;
      left: 22px;
      top: 22px;
      width: 48px;
      height: 26px;
      background: #dfe8ff;
      clip-path: polygon(0 0, 100% 0, 22% 100%);
      opacity: 0.95;
    }

    .plane-fold {
      position: absolute;
      left: 34px;
      top: 19px;
      width: 42px;
      height: 3px;
      background: rgba(20, 30, 80, 0.25);
      transform: rotate(-18deg);
      border-radius: 10px;
    }

    @keyframes flyAcross {
      0% {
        transform: translateX(-160px) translateY(0) rotate(8deg);
      }

      20% {
        transform: translateX(25vw) translateY(-45px) rotate(-4deg);
      }

      40% {
        transform: translateX(45vw) translateY(25px) rotate(6deg);
      }

      60% {
        transform: translateX(65vw) translateY(-35px) rotate(-3deg);
      }

      80% {
        transform: translateX(85vw) translateY(20px) rotate(5deg);
      }

      100% {
        transform: translateX(120vw) translateY(-10px) rotate(8deg);
      }
    }

    .wind {
      position: absolute;
      left: -220px;
      height: 3px;
      width: 160px;
      background: linear-gradient(
        to right,
        transparent,
        rgba(255,255,255,0.8),
        transparent
      );
      border-radius: 50px;
      animation: windMove 4s linear infinite;
    }

    .wind::before,
    .wind::after {
      content: "";
      position: absolute;
      height: 3px;
      background: linear-gradient(
        to right,
        transparent,
        rgba(255,255,255,0.65),
        transparent
      );
      border-radius: 50px;
    }

    .wind::before {
      width: 90px;
      top: -12px;
      left: 35px;
    }

    .wind::after {
      width: 120px;
      top: 12px;
      left: 15px;
    }

    .wind-1 {
      top: 90px;
      animation-delay: 0s;
    }

    .wind-2 {
      top: 180px;
      width: 210px;
      animation-delay: 1.5s;
    }

    .wind-3 {
      top: 320px;
      width: 140px;
      animation-delay: 2.8s;
    }

    @keyframes windMove {
      0% {
        transform: translateX(0);
        opacity: 0;
      }

      15% {
        opacity: 1;
      }

      85% {
        opacity: 1;
      }

      100% {
        transform: translateX(130vw);
        opacity: 0;
      }
    }

    .container {
      width: 430px;
      min-height: 400px;
      background: rgba(125, 20, 40, 0.45);
      backdrop-filter: blur(3px);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 25px 35px 35px;
      z-index: 2;
    }

    h1 {
      color: white;
      font-size: 46px;
      letter-spacing: 2px;
      font-weight: 300;
      margin-bottom: 45px;
    }

    .input-box {
      width: 290px;
      margin-bottom: 55px;
    }

    label {
      display: block;
      color: white;
      font-size: 34px;
      margin-bottom: 8px;
      letter-spacing: 1px;
      font-weight: 300;
    }

    input {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 2px solid white;
      padding: 8px 0;
      color: white;
      font-size: 24px;
      outline: none;
    }

    .start-btn {
      width: 275px;
      height: 86px;
      border: none;
      border-radius: 50px;
      background: rgba(15, 25, 85, 0.82);
      color: white;
      font-size: 52px;
      letter-spacing: 3px;
      cursor: pointer;
      transition: 0.3s;
    }

    .start-btn:hover {
      transform: scale(1.05);
      background: rgba(15, 25, 85, 0.95);
    }

    @media (max-width: 500px) {
      .container {
        width: 88%;
        min-height: 360px;
        padding: 25px 25px 35px;
      }

      h1 {
        font-size: 38px;
        margin-bottom: 35px;
      }

      .input-box {
        width: 85%;
        margin-bottom: 45px;
      }

      .start-btn {
        width: 85%;
        height: 75px;
        font-size: 42px;
      }

      .paper-plane {
        width: 70px;
        height: 45px;
      }

      .plane-body {
        width: 70px;
        height: 35px;
      }
    }
  </style>
</head>
<body>

  <div class="sky-animation">
    <div class="wind wind-1"></div>
    <div class="wind wind-2"></div>
    <div class="wind wind-3"></div>

    <div class="paper-plane">
      <div class="plane-body"></div>
      <div class="plane-wing"></div>
      <div class="plane-fold"></div>
    </div>
  </div>

  <div class="container">
    <h1>ENTER YOUR NAME</h1>

    <div class="input-box">
      <label for="username">NAME</label>
      <input type="text" id="username" />
    </div>

    <button class="start-btn" onclick="startSite()">START</button>
  </div>

  <script>
    function startSite() {
      const username = document.getElementById("username").value.trim();

      if (username === "") {
        alert("Please enter your name!");
      } else {
        alert("Welcome to Nepal, " + username + "!");
      }
    }
  </script>

</body>
</html>
