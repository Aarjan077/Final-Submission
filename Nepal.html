<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login UI</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Oswald', sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:
        linear-gradient(rgba(10,40,100,0.65), rgba(10,40,100,0.75)),
        url('https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?q=80&w=1974&auto=format&fit=crop');
      background-size:cover;
      background-position:center;
      overflow:hidden;
    }

    .container{
      width:420px;
      padding:60px 45px;
      background:rgba(255,255,255,0.06);
      backdrop-filter:blur(3px);
      border:1px solid rgba(255,255,255,0.08);
      text-align:center;
    }

    .tabs{
      display:flex;
      justify-content:center;
      gap:40px;
      margin-bottom:70px;
    }

    .tabs h2{
      color:white;
      font-size:48px;
      font-weight:300;
      letter-spacing:2px;
      cursor:pointer;
    }

    .tabs .active{
      font-weight:500;
    }

    .input-group{
      margin-bottom:50px;
      text-align:left;
    }

    .input-group label{
      display:block;
      color:rgba(255,255,255,0.35);
      font-size:22px;
      margin-bottom:12px;
      letter-spacing:1px;
    }

    .input-group input{
      width:100%;
      background:transparent;
      border:none;
      border-bottom:1px solid rgba(255,255,255,0.25);
      padding:10px 0;
      color:white;
      font-size:18px;
      outline:none;
    }

    .login-btn{
      width:230px;
      height:72px;
      border:none;
      border-radius:40px;
      background:rgba(20,35,80,0.8);
      color:white;
      font-size:34px;
      font-weight:400;
      letter-spacing:2px;
      cursor:pointer;
      transition:0.3s ease;
      margin-top:10px;
    }

    .login-btn:hover{
      background:rgba(30,50,110,0.95);
      transform:scale(1.03);
    }

    .forgot{
      margin-top:45px;
      color:rgba(255,255,255,0.3);
      text-decoration:none;
      display:inline-block;
      font-size:24px;
      letter-spacing:1px;
    }

    @media(max-width:500px){

      .container{
        width:90%;
        padding:40px 25px;
      }

      .tabs h2{
        font-size:36px;
      }

      .login-btn{
        width:100%;
      }
    }
  </style>
</head>
<body>

  <div class="container">

    <div class="tabs">
      <h2 class="active">LOGIN</h2>
      <h2>REGISTER</h2>
    </div>

    <div class="input-group">
      <label>Email</label>
      <input type="email">
    </div>

    <div class="input-group">
      <label>Password</label>
      <input type="password">
    </div>

    <button class="login-btn">LOGIN</button>

    <a href="#" class="forgot">FORGET PASSWORD</a>

  </div>

</body>
</html>
