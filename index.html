<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Nepal Intro Screen</title>

  <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&display=swap" rel="stylesheet">

  <!-- Your CSS file -->
  <link rel="stylesheet" href="nepalStyle.css" />
</head>

<body>

  <div class="paper-plane">
    <div class="plane-main"></div>
    <div class="plane-wing"></div>
    <div class="plane-line"></div>
  </div>

  <div class="wind wind-1"></div>
  <div class="wind wind-2"></div>
  <div class="wind wind-3"></div>

  <div class="box">
    <h1>ENTER YOUR NAME</h1>

    <div class="input-area">
      <label for="username">NAME</label>
      <input type="text" id="username" />
    </div>

    <button class="start-btn" onclick="startSite()">START</button>
  </div>

  <!-- Your JavaScript file -->
  <script src="nepalScript.js"></script>
</body>
</html>
