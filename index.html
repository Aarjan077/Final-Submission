<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Nepal Website</title>

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link 
    href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&display=swap" 
    rel="stylesheet"
  >

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="home-page">

    <!-- Dark overlay -->
    <div class="overlay"></div>

    <!-- Flying paper airplane -->
    <div class="paper-plane">✈</div>

    <!-- Wind effects -->
    <div class="wind wind-1"></div>
    <div class="wind wind-2"></div>
    <div class="wind wind-3"></div>
    <div class="wind wind-4"></div>

    <!-- Website title -->
    <section class="title-area">
      <h1>Explore Nepal</h1>
      <p>Mountains, culture, regions, and stories of Nepal</p>
    </section>

    <!-- Four main buttons -->
    <button 
      class="info-button top-left"
      data-title="Tourism in Nepal"
      data-content="Nepal is one of the most beautiful tourism destinations in the world. It is famous for Mount Everest, trekking routes, temples, lakes, rivers, forests, wildlife, and rich culture. Tourists visit Nepal for adventure, nature, history, and spiritual experiences. Popular places include Kathmandu Valley, Pokhara, Lumbini, Chitwan National Park, and the Everest region."
    >
      Tourism
    </button>

    <button 
      class="info-button top-right"
      data-title="Map of Nepal"
      data-content="Nepal is a landlocked country in South Asia, located between India and China. It has a unique shape and diverse geography. Nepal is commonly divided into three main geographical regions: the Himalayan Region in the north, the Hilly Region in the middle, and the Terai Region in the south."
    >
      Map of Nepal
    </button>

    <button 
      class="info-button bottom-left"
      data-title="Current Affairs of Nepal"
      data-content="Current affairs in Nepal include topics related to politics, education, tourism, climate change, road development, economy, technology, sports, and social issues. Learning about current affairs helps people understand Nepal's present situation and its future development."
    >
      Current Affairs
    </button>

    <button 
      class="info-button bottom-right"
      data-title="Regions of Nepal"
      data-content="Nepal has three main geographical regions. The Himalayan Region has snow-covered mountains and cold climate. The Hilly Region has valleys, forests, rivers, and terraced farms. The Terai Region has flat fertile land, warmer weather, and strong agricultural importance. Each region has its own culture, lifestyle, climate, and natural beauty."
    >
      Regions
    </button>

    <!-- Expanded information box -->
    <section class="modal-box" id="modalBox">
      <button class="close-btn" id="closeBtn">×</button>
      <h2 id="modalTitle"></h2>
      <p id="modalContent"></p>
      <p class="escape-text">Press Esc to close</p>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
